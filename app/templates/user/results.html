{% extends "base.html" %}

{% block title %}Results - {{ event.name }}{% endblock %}

{% block content %}
<div class="text-center mb-4">
    <h2><i class="fas fa-images"></i> Your Photos</h2>
    <p class="text-muted">Event: {{ event.name }}</p>
</div>

<div class="card shadow">
    <div class="card-body">
        <div id="photosGrid" class="row g-3">
            <!-- Photos will be loaded here -->
        </div>
    </div>
</div>

<div class="mt-3">
    <a href="{{ url_for('user.capture_selfie', event_id=event.id) }}" class="btn btn-primary">
        <i class="fas fa-redo"></i> Search Again
    </a>
    <a href="{{ url_for('user.select_event') }}" class="btn btn-secondary">
        <i class="fas fa-arrow-left"></i> Back to Events
    </a>
</div>
{% endblock %}
