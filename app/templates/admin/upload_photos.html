{% extends "base.html" %}

{% block title %}Upload Photos - {{ event.name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="fas fa-upload"></i> Upload Photos</h4>
                <small>Event: {{ event.name }}</small>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('admin.upload_photos', event_id=event.id) }}" 
                      enctype="multipart/form-data" id="uploadForm">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    
                    <div class="mb-3">
                        <label for="photos" class="form-label">Select Photos *</label>
                        <input type="file" 
                               class="form-control" 
                               id="photos" 
                               name="photos" 
                               multiple 
                               accept="image/*"
                               required>
                        <div class="form-text">You can select multiple photos at once (JPG, PNG, GIF)</div>
                    </div>
                    
                    <div id="preview" class="mb-3 row g-2"></div>
                    
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('admin.view_event', event_id=event.id) }}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left"></i> Back
                        </a>
                        <button type="submit" class="btn btn-primary" id="uploadBtn">
                            <i class="fas fa-upload"></i> Upload Photos
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
document.getElementById('photos').addEventListener('change', function(e) {
    const preview = document.getElementById('preview');
    preview.innerHTML = '';
    
    const files = e.target.files;
    for (let i = 0; i < Math.min(files.length, 12); i++) {
        const file = files[i];
        const reader = new FileReader();
        
        reader.onload = function(event) {
            const div = document.createElement('div');
            div.className = 'col-md-2 col-4';
            div.innerHTML = `
                <img src="${event.target.result}" 
                     class="img-thumbnail" 
                     style="height: 100px; object-fit: cover; width: 100%;">
            `;
            preview.appendChild(div);
        };
        
        reader.readAsDataURL(file);
    }
    
    if (files.length > 12) {
        const div = document.createElement('div');
        div.className = 'col-12 text-muted small';
        div.textContent = `... and ${files.length - 12} more`;
        preview.appendChild(div);
    }
});
</script>
{% endblock %}
